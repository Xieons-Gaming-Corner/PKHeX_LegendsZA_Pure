# .github/workflows/dotnet-desktop.yml
# Builds, tests, signs (optional) and packages a WPF/WinForms desktop app on Windows runners.
# Replace placeholders (SOLUTION_FILE, TEST_PROJECT, WAP_PROJECT_DIR, WAP_PROJECT_FILE) to match repo layout.

name: .NET Core Desktop

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest

    env:
      # --- EDIT THESE TO MATCH YOUR REPO ---
      SOLUTION_FILE: "PKHeX.sln"
      TEST_PROJECT: "tests/PKHeX.Tests/PKHeX.Tests.csproj"
      WAP_PROJECT_DIR: "src/PKHeX.Package"
      WAP_PROJECT_FILE: "src/PKHeX.Package/PKHeX.Package.wapproj"
      # --------------------------------------
      # Expected secrets (optional):
      # - Base64_Encoded_Pfx : base64 of .pfx (optional)
      # - Pfx_Key            : password for .pfx (optional)

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8.0.x"

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Restore solution
      run: |
        echo "Restoring solution: $env:SOLUTION_FILE"
        dotnet restore "$env:SOLUTION_FILE"

    - name: Build solution
      run: |
        echo "Building solution (${{ matrix.configuration }})"
        dotnet build "$env:SOLUTION_FILE" --configuration ${{ matrix.configuration }} --no-restore

    - name: Run unit tests
      run: |
        echo "Running tests for configuration: ${{ matrix.configuration }}"
        if (Test-Path "${{ env.TEST_PROJECT }}" ) {
          dotnet test "${{ env.TEST_PROJECT }}" --configuration ${{ matrix.configuration }} --no-build
        } else {
          dotnet test "${{ env.SOLUTION_FILE }}" --configuration ${{ matrix.configuration }} --no-build
        }

    - name: Decode signing certificate (.pfx) (if secret present)
      if: ${{ secrets.Base64_Encoded_Pfx != '' }}
      env:
        BASE64_ENCODED_PFX: ${{ secrets.Base64_Encoded_Pfx }}
      run: |
        $pfxBytes = [System.Convert]::FromBase64String($env:BASE64_ENCODED_PFX)
        $pfxPath = Join-Path -Path $env:WAP_PROJECT_DIR -ChildPath "GitHubActionsWorkflow.pfx"
        Write-Host "Writing pfx to $pfxPath"
        [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
        Write-Host "PFX written to: $pfxPath"

    - name: Build & create app package (SIGNED, if PFX + password present)
      if: ${{ secrets.Base64_Encoded_Pfx != '' && secrets.Pfx_Key != '' }}
      env:
        PFX_KEY: ${{ secrets.Pfx_Key }}
      run: |
        $wapproj = "${{ env.WAP_PROJECT_FILE }}"
        if (-not (Test-Path $wapproj)) {
          Write-Error "WAP project not found at: $wapproj"
          exit 1
        }
        $pfxPath = Join-Path -Path $env:WAP_PROJECT_DIR -ChildPath "GitHubActionsWorkflow.pfx"
        Write-Host "Packaging (signed) using pfx: $pfxPath"
        msbuild $wapproj `
          /p:Configuration=${{ matrix.configuration }} `
          /p:AppxBundle=Always `
          /p:AppxBundlePlatforms="x86|x64" `
          /p:UapAppxPackageBuildMode=StoreUpload `
          /p:PackageCertificateKeyFile="$pfxPath" `
          /p:PackageCertificatePassword="${{ secrets.Pfx_Key }}"

    - name: Build & create app package (UNSIGNED fallback)
      if: ${{ secrets.Base64_Encoded_Pfx == '' || secrets.Pfx_Key == '' }}
      run: |
        $wapproj = "${{ env.WAP_PROJECT_FILE }}"
        if (-not (Test-Path $wapproj)) {
          Write-Error "WAP project not found at: $wapproj"
          exit 1
        }
        Write-Host "Packaging (unsigned fallback)"
        msbuild $wapproj `
          /p:Configuration=${{ matrix.configuration }} `
          /p:AppxBundle=Always `
          /p:AppxBundlePlatforms="x86|x64" `
          /p:UapAppxPackageBuildMode=StoreUpload

    - name: Remove signing certificate (if any)
      run: |
        $pfxPath = Join-Path -Path $env:WAP_PROJECT_DIR -ChildPath "GitHubActionsWorkflow.pfx"
        if (Test-Path $pfxPath) {
          Remove-Item -Path $pfxPath -Force -ErrorAction SilentlyContinue
          Write-Host "Removed pfx: $pfxPath"
        } else {
          Write-Host "No pfx found to remove at: $pfxPath"
        }

    - name: Upload MSIX/MSIXBundle artifacts
      uses: actions/upload-artifact@v4
      with:
        name: MSIX-Packages
        path: ${{ env.WAP_PROJECT_DIR }}\AppPackages\*
